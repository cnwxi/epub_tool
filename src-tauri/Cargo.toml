[package]
name = "epub_tool_newui"
version = "26.8.11"
default-run = "epub_tool_newui"
description = "Tauri 2 shell for epub_tool"
authors = ["cnwxi"]
edition = "2021"

[lib]
name = "epub_tool_newui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }
prost-build = "0.13"
protoc-bin-vendored = "3"
pbjson-build = "0.7"

[dependencies]
encoding_rs = "0.8"
image = { version = "0.25.5", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
percent-encoding = "2.3"
png = "0.18"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
prost = "0.13"
pbjson = "0.7"
tauri = { version = "2.2.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.2.0"
webp = "0.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tauri-plugin-fs = "2.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
