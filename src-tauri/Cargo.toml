[package]
name = "epub_tool_newui"
version = "26.7.25"
description = "Tauri 2 shell for epub_tool"
authors = ["cnwxi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
encoding_rs = "0.8"
dom_query = { version = "0.27", default-features = false }
fontdue = "0.9"
image = { version = "0.25.5", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
icu_properties = "2.2"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "api-24"] }
percent-encoding = "2.3"
png = "0.18"
regex = "1.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ttf-parser = "0.25"
write-fonts = { version = "0.51", features = ["read"] }
tauri = { version = "2.2.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.2.0"
webp = "0.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
tauri = { version = "2.2.5", features = ["macos-private-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
