name: Android Build And Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release with signed Android APKs"
        required: true
        default: true
        type: boolean
      release_type:
        description: "GitHub release channel"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - pre_release
      version:
        description: "Release version"
        required: false
        default: ""
      body:
        description: "Release body text（留空使用更新日志与 Android 安装说明）"
        required: false
        default: ""

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-22.04
    outputs:
      asset_version: ${{ steps.release_version.outputs.asset_version }}
      release_version: ${{ steps.release_version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ -z "$app_version" ]; then
            echo "无法从 src-tauri/Cargo.toml 读取应用版本" >&2
            exit 1
          fi

          asset_version="${{ inputs.version }}"
          asset_version="${asset_version#v}"
          if [ -z "$asset_version" ]; then
            asset_version="$app_version"
          fi
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "release_version=v$asset_version" >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ matrix.target.abi }} Release APK
    runs-on: ubuntu-24.04
    needs:
      - prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - tauri_target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
          - tauri_target: armv7
            rust_target: armv7-linux-androideabi
            abi: armeabi-v7a
          - tauri_target: x86_64
            rust_target: x86_64-linux-android
            abi: x86_64
          - tauri_target: i686
            rust_target: i686-linux-android
            abi: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="/usr/local/lib/android/sdk"
          if [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "GitHub runner 未找到预安装的 Android SDK: $sdk_root" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36 and NDK 29
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Initialize generated Android project
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build release APK
        run: >-
          cargo run --locked --manifest-path xtask/Cargo.toml --
          mobile-build android ${{ matrix.target.tauri_target }} --split-per-abi --apk --ci

      - name: Verify Android APK metadata and launcher
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -path '*/release/*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "未找到 release Android APK" >&2
            exit 1
          fi
          aapt2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 \
            | sort -V | tail -n 1)
          if [ -z "$aapt2" ]; then
            echo "Android SDK 中未找到 aapt2" >&2
            exit 1
          fi
          badging=$("$aapt2" dump badging "$apk")
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          config_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test -n "$cargo_version"
          test "$cargo_version" = "$config_version"
          grep -F "versionName='$cargo_version'" <<<"$badging"
          grep -F "application-icon-" <<<"$badging"
          cmp \
            src-tauri/.icon-build/android/mipmap-xxxhdpi/ic_launcher.png \
            src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cmp \
            src-tauri/.icon-build/android/mipmap-xxxhdpi/ic_launcher_foreground.png \
            src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Sign Android release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -path '*/release/*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "未找到 release Android APK" >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/android-release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
              [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
              [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              echo "Android keystore 已配置，但密码或 alias secret 不完整" >&2
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_alias="$ANDROID_KEY_ALIAS"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "未配置 Android release keystore，使用本次 CI 临时签名；后续版本不能依靠该签名覆盖升级。" >&2
            store_password="android"
            key_alias="androidrelease"
            key_password="android"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Epub Tool, OU=Development, O=cnwxi, C=CN"
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "Android SDK 中未找到 apksigner" >&2
            exit 1
          fi
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$store_password" \
            --ks-key-alias "$key_alias" \
            --key-pass "pass:$key_password" \
            "$apk"
          "$apksigner" verify --verbose "$apk"

      - name: Upload signed Android compile artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.target.abi }}-release
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/**/*.apk
          if-no-files-found: error

      - name: Prepare renamed Android release asset
        if: inputs.release
        shell: bash
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
          ABI: ${{ matrix.target.abi }}
          PRODUCT_STEM: Epub.Tool.Android
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -path '*/release/*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "未找到 release Android APK" >&2
            exit 1
          fi
          case "$apk" in
            */outputs/apk/*/release/*) ;;
            *) echo "选择的 APK 不在 ABI release 输出目录: $apk" >&2; exit 1 ;;
          esac
          mkdir -p release-assets
          cp "$apk" "release-assets/${PRODUCT_STEM}_${ASSET_VERSION}_android_${ABI}_release.apk"

      - name: Upload renamed Android release asset
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-android-${{ matrix.target.abi }}
          path: release-assets
          if-no-files-found: error

  publish_release:
    name: Publish Android Release
    if: inputs.release
    runs-on: ubuntu-22.04
    needs:
      - prepare
      - android
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download renamed release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-android-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release body
        shell: bash
        env:
          RELEASE_BODY: ${{ inputs.body }}
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_BODY" ]; then
            printf '%s\n' "$RELEASE_BODY" > release-body.md
            exit 0
          fi
          printf '## Android 构建\n\n本次发布提供已签名的 release APK：`arm64-v8a`、`armeabi-v7a`、`x86_64` 和 `x86`。\n\n请下载与设备 ABI 匹配的 APK。若仓库未配置稳定的 Android keystore，本次构建会使用临时签名，后续版本无法覆盖安装升级；需要持续升级时请配置并长期保留仓库外的 keystore。Google Play 正式发布仍需要商店签名配置。\n\n### 安装说明\n\n1. 根据设备 ABI 下载对应 APK。大多数现代安卓手机请选择 `arm64-v8a`。\n2. 在系统设置中允许当前浏览器或文件管理器“安装未知来源应用”。\n3. 打开 APK 完成安装；如果设备上已安装同包名的旧版本，签名不一致时请先卸载旧版本。\n' > release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_version }}
          name: ${{ needs.prepare.outputs.release_version }}
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ inputs.release_type == 'pre_release' }}
          make_latest: ${{ inputs.release_type == 'latest' && 'true' || 'false' }}
