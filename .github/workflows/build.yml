name: Android Build And Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release with unsigned Android APKs"
        required: true
        default: true
        type: boolean
      release_type:
        description: "GitHub release channel"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - pre_release
      version:
        description: "Release version"
        required: false
        default: ""
      body:
        description: "Release body text（留空使用更新日志与 Android 安装说明）"
        required: false
        default: ""

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-22.04
    outputs:
      asset_version: ${{ steps.release_version.outputs.asset_version }}
      release_version: ${{ steps.release_version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ -z "$app_version" ]; then
            echo "无法从 src-tauri/Cargo.toml 读取应用版本" >&2
            exit 1
          fi

          asset_version="${{ inputs.version }}"
          asset_version="${asset_version#v}"
          if [ -z "$asset_version" ]; then
            asset_version="$app_version"
          fi
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "release_version=v$asset_version" >> "$GITHUB_OUTPUT"

  quality:
    name: Rust And Frontend Quality Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Verify generated protocol code
        run: npm run protocol:check

      - name: Check Rust formatting, tests, and clippy
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path xtask/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path xtask/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

      - name: Build frontend
        run: npm run build

  android:
    name: Android ${{ matrix.target.abi }} Unsigned Compile Validation
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - tauri_target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
          - tauri_target: armv7
            rust_target: armv7-linux-androideabi
            abi: armeabi-v7a
          - tauri_target: x86_64
            rust_target: x86_64-linux-android
            abi: x86_64
          - tauri_target: i686
            rust_target: i686-linux-android
            abi: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="/usr/local/lib/android/sdk"
          if [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "GitHub runner 未找到预安装的 Android SDK: $sdk_root" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36 and NDK 29
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "ndk;29.0.13846066"

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Initialize generated Android project
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build unsigned release APK
        run: >-
          cargo run --locked --manifest-path xtask/Cargo.toml --
          mobile-build android ${{ matrix.target.tauri_target }} --apk --ci

      - name: Upload unsigned Android compile artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.target.abi }}-unsigned-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Prepare renamed Android release asset
        if: inputs.release
        shell: bash
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
          ABI: ${{ matrix.target.abi }}
          PRODUCT_STEM: Epub.Tool.Android
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "未找到可上传的 Android APK" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$apk" "release-assets/${PRODUCT_STEM}_${ASSET_VERSION}_android_${ABI}_unsigned-release.apk"

      - name: Upload renamed Android release asset
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-android-${{ matrix.target.abi }}
          path: release-assets
          if-no-files-found: error

  publish_release:
    name: Publish Android Release
    if: inputs.release
    runs-on: ubuntu-22.04
    needs:
      - prepare
      - android
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download renamed release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-android-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release body
        shell: bash
        env:
          RELEASE_BODY: ${{ inputs.body }}
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_BODY" ]; then
            printf '%s\n' "$RELEASE_BODY" > release-body.md
            exit 0
          fi
          printf '## Android 构建\n\n本次发布提供无签名 release APK：`arm64-v8a`、`armeabi-v7a`、`x86_64` 和 `x86`。\n\n请下载与设备 ABI 匹配的 APK。Google Play 正式发布仍需要仓库外的 keystore 与签名配置。\n' > release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_version }}
          name: ${{ needs.prepare.outputs.release_version }}
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ inputs.release_type == 'pre_release' }}
          make_latest: ${{ inputs.release_type == 'latest' && 'true' || 'false' }}
